[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vision-memory"
version = "0.1.0"
description = "Modular open-set visual recognition and object-memory core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.1", "transformers>=4.45", "scikit-learn>=1.3"]

[project.optional-dependencies]
clustering = ["hdbscan>=0.8.40"]
app = ["streamlit>=1.57"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
